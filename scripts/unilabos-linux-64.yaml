name: unilab
channels:
  - conda-forge
  - robostack-jazzy
  - uni-lab
dependencies:
  # Basics
  - python=3.12.13
  - compilers
  - cmake
  - make
  - ninja
  - sphinx
  - sphinx_rtd_theme
  # Data Visualization
  - numpy=1.26.4
  - scipy
  - pandas
  - networkx
  - matplotlib
  - pint
  # Device communication
  - pyserial
  - pyusb
  - pylibftdi
  - pymodbus >=3.6.9,<4
  - python-can
  - pyvisa
  - opencv
  # Service
  - pydantic
  - fastapi
  - uvicorn
  - gradio
  - flask
  - websockets
  # Notebook
  - ipython
  - jupyter
  - jupyros
  # ros
  - colcon-common-extensions
  - ros-jazzy-desktop-full
  - ros-jazzy-control-msgs
  - ros-jazzy-sensor-msgs
  - ros-jazzy-trajectory-msgs
  - ros-jazzy-navigation2
  - ros-jazzy-ros2-control
  - ros-jazzy-robot-state-publisher
  - ros-jazzy-joint-state-publisher
  # web and visualization
  - ros-jazzy-rosbridge-server
  - ros-jazzy-cv-bridge
  # geometry & motion planning
  - ros-jazzy-tf2
  - ros-jazzy-moveit
  - ros-jazzy-moveit-servo
  # simulation
  - ros-jazzy-simulation
  - ros-jazzy-tf-transformations
  - transforms3d
  # ros-jazzy-gazebo-ros // ignored because of the conflict with ign-gazebo
  # ilab equipments
  - uni-lab::ros-jazzy-unilabos-msgs
  - zeep
  - jinja2
  - pprp
  - pip:
      - paho-mqtt
      - opentrons_shared_data>=9.1.1,<10
      - git+https://github.com/Xuwznln/pylabrobot
