# unilabos: Production package (depends on unilabos-env + pip unilabos)
# For production deployment

package:
  name: unilabos
  version: 0.11.4

source:
  - path: ../../unilabos
    target_directory: unilabos
  - path: ../../native/scheduler-queue
    target_directory: native/scheduler-queue
  - path: ../../native/scheduler_shared
    target_directory: native/scheduler_shared

build:
  # 源码内容不会进入 rattler 的 variant hash；本轮 Runtime/Supervisor 变更
  # 必须提升 build number，避免 Constructor 缓存把旧源码同名包一起写入显式清单。
  number: 3
  python:
    entry_points:
    - unilab = unilabos.app.main:main
    - unilab-supervisor = unilabos.managed_runtime.supervisor:main
  script:
  - set PIP_NO_INDEX=
  - if: win
    then:
    - copy %RECIPE_DIR%\..\..\MANIFEST.in %SRC_DIR%
    - copy %RECIPE_DIR%\..\..\setup.cfg %SRC_DIR%
    - copy %RECIPE_DIR%\..\..\setup.py %SRC_DIR%
    - copy %RECIPE_DIR%\..\..\pyproject.toml %SRC_DIR%
    - pip install %SRC_DIR%
  - if: unix
    then:
    - cp $RECIPE_DIR/../../MANIFEST.in $SRC_DIR
    - cp $RECIPE_DIR/../../setup.cfg $SRC_DIR
    - cp $RECIPE_DIR/../../setup.py $SRC_DIR
    - cp $RECIPE_DIR/../../pyproject.toml $SRC_DIR
    - pip install $SRC_DIR

requirements:
  build:
  - rust
  host:
  - python ==3.11.14
  - pip
  - setuptools
  - jsonschema >=4.18
  - zstd
  - zstandard
  run:
  - zstd
  - zstandard
  - networkx
  - typing_extensions
  - websockets
  - pint
  - fastapi
  - jinja2
  - requests
  - rfc8785 >=0.1.4,<0.2
  - uvicorn
  # conda-forge does not publish python-opcua for osx-arm64. The UniLab
  # channel carries the same pure-Python package for every Runtime target.
  - opcua ==0.98.13
  - pyserial
  - pandas
  - pymodbus
  - matplotlib
  - msgcenterpy >=0.1.8,<0.2
  - pylabrobot ==0.2.1
  - pylibftdi
  - uni-lab::unilabos-env ==0.11.4

about:
  repository: https://github.com/deepmodeling/Uni-Lab-OS
  license: GPL-3.0-only
  description: "UniLabOS - Production package with minimal ROS2 dependencies"
