neware_battery_test_system:
  category:
  - neware_battery_test_system
  - neware
  - battery_test
  class:
    action_value_mappings:
      auto-print_status_summary:
        feedback: {}
        goal: {}
        goal_default: {}
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: ''
          properties:
            feedback: {}
            goal:
              properties: {}
              required: []
              type: object
            result: {}
          required:
          - goal
          title: print_status_summary参数
          type: object
        type: UniLabJsonCommand
      auto-test_connection:
        feedback: {}
        goal: {}
        goal_default: {}
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: ''
          properties:
            feedback: {}
            goal:
              properties: {}
              required: []
              type: object
            result:
              type: boolean
          required:
          - goal
          title: test_connection参数
          type: object
        type: UniLabJsonCommand
      auto-upload_csv_to_datacore:
        always_free: true
        feedback: {}
        goal: {}
        goal_default:
          file_path: ''
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: 手动把指定 CSV 推送到 DataCore 大装置数据接入，用于补传历史文件或重传失败的文件
          properties:
            feedback: {}
            goal:
              properties:
                file_path:
                  title: "CSV 文件路径\n（需要主控电脑的路径）"
                  description: 待上传文件的完整路径；筛选请在外部完成，这里一次只认一个文件。非 .csv 会告警但仍会上传
                  type: string
              required:
              - file_path
              type: object
            result:
              type: object
          required:
          - goal
          title: upload_csv_to_datacore参数
          type: object
        type: UniLabJsonCommand
      debug_resource_names:
        feedback: {}
        goal: {}
        goal_default: {}
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: 调试方法：显示所有资源的实际名称
          properties:
            feedback: {}
            goal:
              properties: {}
              required: []
              type: object
            result:
              type: object
          required:
          - goal
          title: debug_resource_names参数
          type: object
        type: UniLabJsonCommand
      export_status_json:
        feedback: {}
        goal:
          filepath: filepath
        goal_default:
          filepath: bts_status.json
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: 导出当前状态数据到JSON文件
          properties:
            feedback: {}
            goal:
              properties:
                filepath:
                  default: bts_status.json
                  description: 输出文件路径
                  type: string
              required: []
              type: object
            result:
              type: object
          required:
          - goal
          title: export_status_json参数
          type: object
        type: UniLabJsonCommand
      get_device_summary:
        feedback: {}
        goal: {}
        goal_default: {}
        handles: {}
        result:
          return_info: return_info
          success: success
        schema:
          description: 获取设备级别的摘要统计信息
          properties:
            feedback: {}
            goal:
              properties: {}
              required: []
              type: object
            result:
              properties:
                return_info:
                  description: 设备摘要信息JSON格式
                  type: string
                success:
                  description: 查询是否成功
                  type: boolean
              required:
              - return_info
              - success
              type: object
          required:
          - goal
          type: object
        type: UniLabJsonCommand
      get_plate_status:
        feedback: {}
        goal:
          plate_num: plate_num
        goal_default:
          plate_num: null
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: 获取指定盘或所有盘的状态信息
          properties:
            feedback: {}
            goal:
              properties:
                plate_num:
                  description: 盘号 (1 或 2)，如果为None则返回所有盘的状态
                  type: integer
              required: []
              type: object
            result:
              type: object
          required:
          - goal
          title: get_plate_status参数
          type: object
        type: UniLabJsonCommand
      print_status_summary_action:
        feedback: {}
        goal: {}
        goal_default: {}
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: 打印通道状态摘要信息到控制台
          properties:
            feedback: {}
            goal:
              properties: {}
              required: []
              type: object
            result:
              type: object
          required:
          - goal
          title: print_status_summary_action参数
          type: object
        type: UniLabJsonCommand
      query_plate_action:
        feedback: {}
        goal:
          plate_id: plate_id
          string: string
        goal_default:
          string: ''
        handles: {}
        placeholder_keys: {}
        result:
          return_info: return_info
          success: success
        schema:
          description: ''
          properties:
            feedback:
              additionalProperties: true
              title: StrSingleInput_Feedback
              type: object
            goal:
              additionalProperties: false
              properties:
                string:
                  type: string
              title: StrSingleInput_Goal
              type: object
            result:
              additionalProperties: false
              properties:
                return_info:
                  type: string
                success:
                  type: boolean
              title: StrSingleInput_Result
              type: object
          required:
          - goal
          title: StrSingleInput
          type: object
        type: StrSingleInput
      submit_from_csv_export_ndax:
        feedback: {}
        goal:
          csv_path: string
          output_dir: string
        goal_default:
          csv_path: null
          output_dir: .
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: 从CSV文件批量提交Neware测试任务（备份格式为NDA）
          properties:
            feedback: {}
            goal:
              properties:
                csv_path:
                  description: 输入CSV文件路径
                  type: string
                output_dir:
                  default: .
                  description: 输出目录，用于存储XML文件和备份，默认当前目录
                  type: string
              required:
              - csv_path
              type: object
            result:
              type: object
          required:
          - goal
          title: submit_from_csv_export_ndax参数
          type: object
        type: UniLabJsonCommand
      submit_from_csv_export_excel:
        feedback: {}
        goal:
          csv_path: string
          output_dir: string
        goal_default:
          csv_path: null
          output_dir: .
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: 从CSV文件批量提交Neware测试任务（备份格式为Excel）
          properties:
            feedback: {}
            goal:
              properties:
                csv_path:
                  description: 输入CSV文件的绝对路径
                  type: string
                output_dir:
                  default: .
                  description: 输出目录（用于存储XML和备份文件），默认当前目录
                  type: string
              required:
              - csv_path
              type: object
            result:
              type: object
          required:
          - goal
          title: submit_from_csv_export_excel参数
          type: object
        type: UniLabJsonCommand
      test_connection_action:
        feedback: {}
        goal: {}
        goal_default: {}
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: 测试与电池测试系统的TCP连接
          properties:
            feedback: {}
            goal:
              properties: {}
              required: []
              type: object
            result:
              type: object
          required:
          - goal
          title: test_connection_action参数
          type: object
        type: UniLabJsonCommand
      upload_backup_to_oss:
        feedback: {}
        goal:
          backup_dir: backup_dir
          file_pattern: file_pattern
          oss_prefix: oss_prefix
        goal_default:
          backup_dir: null
          file_pattern: '*'
          oss_prefix: null
        handles:
          output:
          - data_key: uploaded_files
            data_source: executor
            data_type: array
            handler_key: uploaded_files
            io_type: sink
            label: Uploaded Files (with standard flow info)
        placeholder_keys: {}
        result: {}
        schema:
          description: 上传备份文件到阿里云OSS
          properties:
            feedback: {}
            goal:
              properties:
                backup_dir:
                  description: 备份目录路径，默认使用最近一次 submit_from_csv 的 backup_dir
                  type: string
                file_pattern:
                  default: '*'
                  description: 文件通配符模式，默认 "*" 上传所有文件（例如 "*.csv" 仅上传 CSV 文件）
                  type: string
                oss_prefix:
                  description: OSS 对象前缀，默认使用类初始化时的配置
                  type: string
              required: []
              type: object
            result:
              type: object
          required:
          - goal
          title: upload_backup_to_oss参数
          type: object
        type: UniLabJsonCommand
      mock_assembly_data:
        type: UniLabJsonCommand
        goal: {}
        feedback: {}
        result:
          assembly_data: assembly_data
          success: success
          return_info: return_info
        schema:
          title: mock_assembly_data参数
          description: 模拟扣电组装站 auto-func_sendbottle_allpack_multi 输出固定的 assembly_data（用于测试 neware 完整链路）
          type: object
          properties:
            goal:
              type: object
              properties:
                unilabos_device_id:
                  type: string
                  default: ''
                  description: UniLabOS设备ID，用于指定执行动作的具体设备实例
              required: []
            feedback: {}
            result:
              type: object
          required:
          - goal
        goal_default: {}
        handles:
          input: []
          output:
          - handler_key: assembly_data_output
            data_type: array
            label: 扣电组装数据列表（模拟）
            data_key: assembly_data
            data_source: executor
        placeholder_keys: {}
      manual_confirm:
        type: UniLabJsonCommand
        goal:
          resource: resource
          target_device: target_device
          mount_resource: mount_resource
          formulations: formulations
          assembly_data: assembly_data
          csv_export_dir: csv_export_dir
          # 超时由 node_type=manual_confirm 的外层调度/前端等待机制处理；设备函数体内不做本地计时中断
          timeout_seconds: timeout_seconds
          assignee_user_ids: assignee_user_ids
          A: A
          B: B
          C: C
        feedback: {}
        result:
          resource: resource
          coin_cell_code: coin_cell_code
          electrolyte_code: electrolyte_code
          target_device: target_device
          mount_resource: mount_resource
          collector_mass: collector_mass
          active_material: active_material
          capacity: capacity
          battery_system: battery_system
          pole_weight: pole_weight
        schema:
          title: manual_confirm参数
          description: manual_confirm的参数schema
          type: object
          properties:
            goal:
              type: object
              properties:
                unilabos_device_id:
                  type: string
                  default: ''
                  title: UniLabOS设备ID
                  description: UniLabOS设备ID，用于指定执行动作的具体设备实例
                resource:
                  title: 资源（无需填写）
                  description: 无需填写
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      sample_id:
                        type: string
                      children:
                        type: array
                        items:
                          type: string
                      parent:
                        type: string
                      type:
                        type: string
                      category:
                        type: string
                      pose:
                        type: object
                        properties:
                          position:
                            type: object
                            properties:
                              x:
                                type: number
                                minimum: -1.7976931348623157e+308
                                maximum: 1.7976931348623157e+308
                              y:
                                type: number
                                minimum: -1.7976931348623157e+308
                                maximum: 1.7976931348623157e+308
                              z:
                                type: number
                                minimum: -1.7976931348623157e+308
                                maximum: 1.7976931348623157e+308
                            required:
                            - x
                            - y
                            - z
                            title: position
                            additionalProperties: false
                          orientation:
                            type: object
                            properties:
                              x:
                                type: number
                                minimum: -1.7976931348623157e+308
                                maximum: 1.7976931348623157e+308
                              y:
                                type: number
                                minimum: -1.7976931348623157e+308
                                maximum: 1.7976931348623157e+308
                              z:
                                type: number
                                minimum: -1.7976931348623157e+308
                                maximum: 1.7976931348623157e+308
                              w:
                                type: number
                                minimum: -1.7976931348623157e+308
                                maximum: 1.7976931348623157e+308
                            required:
                            - x
                            - y
                            - z
                            - w
                            title: orientation
                            additionalProperties: false
                        required:
                        - position
                        - orientation
                        title: pose
                        additionalProperties: false
                      config:
                        type: string
                      data:
                        type: string
                    title: resource
                  type: array
                target_device:
                  title: 目标设备
                  type: string
                  description: 无需填写
                mount_resource:
                  title: 新威测试通道
                  description: 需要在此指定新威通道
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      sample_id:
                        type: string
                      children:
                        type: array
                        items:
                          type: string
                      parent:
                        type: string
                      type:
                        type: string
                      category:
                        type: string
                      pose:
                        type: object
                        properties:
                          position:
                            type: object
                            properties:
                              x:
                                type: number
                                minimum: -1.7976931348623157e+308
                                maximum: 1.7976931348623157e+308
                              y:
                                type: number
                                minimum: -1.7976931348623157e+308
                                maximum: 1.7976931348623157e+308
                              z:
                                type: number
                                minimum: -1.7976931348623157e+308
                                maximum: 1.7976931348623157e+308
                            required:
                            - x
                            - y
                            - z
                            title: position
                            additionalProperties: false
                          orientation:
                            type: object
                            properties:
                              x:
                                type: number
                                minimum: -1.7976931348623157e+308
                                maximum: 1.7976931348623157e+308
                              y:
                                type: number
                                minimum: -1.7976931348623157e+308
                                maximum: 1.7976931348623157e+308
                              z:
                                type: number
                                minimum: -1.7976931348623157e+308
                                maximum: 1.7976931348623157e+308
                              w:
                                type: number
                                minimum: -1.7976931348623157e+308
                                maximum: 1.7976931348623157e+308
                            required:
                            - x
                            - y
                            - z
                            - w
                            title: orientation
                            additionalProperties: false
                        required:
                        - position
                        - orientation
                        title: pose
                        additionalProperties: false
                      config:
                        type: string
                      data:
                        type: string
                    title: mount_resource
                  type: array
                A:
                  title: 模式A
                  description: 模式A：所有电池参数一致（仅在此区填一组参数，后端自动发送到所有电池）
                  type: object
                  properties:
                    default_collector_mass:
                      type: number
                      title: 集流体质量（mg）
                      description: 集流体质量 (mg)，整批共用
                    default_active_material:
                      type: string
                      title: 活性物质含量
                      description: 活性物质含量（如 "0.97" 或 "97%"），整批共用
                    default_capacity:
                      type: number
                      title: 克容量（mAh/g）
                      description: 克容量 (mAh/g)，整批共用
                    default_battery_system:
                      type: string
                      title: 电池体系
                      description: xml 工步标识（如 "811_LI_002"），整批共用
                B:
                  title: 模式B
                  description: 模式B：参数不一致 且 数量少（按上游电池数量逐颗填写 4 个参数，长度需等于电池总数）
                  type: object
                  properties:
                    collector_mass:
                      type: array
                      title: 集流体质量（mg）
                      items:
                        type: number
                    active_material:
                      type: array
                      title: 活性物质含量
                      items:
                        type: string
                    capacity:
                      type: array
                      title: 克容量（mAh/g）
                      items:
                        type: number
                    battery_system:
                      type: array
                      title: 电池体系
                      items:
                        type: string
                C:
                  title: 模式C
                  description: 模式C：参数不一致 且 数量多（上传 CSV 文件，按 coin_cell_code 与电池对齐；CSV 表头需包含 coin_cell_code(或 电池条码) / 集流体质量(或 collector_mass) / 活性物质含量(或 active_material) / 克容量(或 capacity) / 电池体系(或 xml工步/battery_system)；行序不敏感）
                  type: object
                  properties:
                    param_csv_path:
                      type: string
                      title: 参数CSV路径
                      description: CSV 文件绝对路径
                formulations:
                  title: 配方表
                  type: array
                  description: 无需填写
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      orderCode:
                        type: string
                        title: 订单编号
                      orderName:
                        type: string
                        title: 订单名称
                      real_mass_ratio:
                        type: object
                        title: 实际质量比
                      target_mass_ratio:
                        type: object
                        title: 目标质量比
                      prep_bottle_barcode:
                        type: string
                        title: 配液瓶条码
                      vial_bottle_barcodes:
                        type: string
                        title: 分液瓶条码
                      error:
                        type: string
                        title: 错误信息
                assembly_data:
                  title: 组装数据
                  type: array
                  description: 扣电组装数据列表（每颗电池一个对象，含 Time/open_circuit_voltage/pole_weight 等 9 字段）
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      Time:
                        type: string
                        title: 时间
                      open_circuit_voltage:
                        type: number
                        title: 开路电压
                      pole_weight:
                        type: number
                        title: 极片质量
                      assembly_time:
                        type: number
                        title: 组装时间
                      assembly_pressure:
                        type: number
                        title: 组装压力
                      target_assembly_pressure:
                        type: number
                        title: 目标组装压力
                      electrolyte_volume:
                        type: number
                        title: 电解液体积
                      data_coin_type:
                        type: integer
                        title: 扣电类型
                      electrolyte_code:
                        type: string
                        title: 电解液编码
                      coin_cell_code:
                        type: string
                        title: 扣式电池编码
                csv_export_dir:
                  type: string
                  default: 'D:\2604Agentic_test'
                  title: "电池通道CSV导出目录\n（需要新威电脑的路径）"
                  description: 整合 CSV 导出根目录（按日期子目录分组）
                timeout_seconds:
                  title: 通知超时时间（s）
                  type: integer
                assignee_user_ids:
                  title: 通知用户
                  type: array
                  items:
                    type: string
              required:
              - timeout_seconds
              - assignee_user_ids
              _unilabos_placeholder_info:
                resource: unilabos_resources
                target_device: unilabos_devices
                mount_resource: unilabos_resources
                assignee_user_ids: unilabos_manual_confirm
            feedback: {}
            result:
              type: object
          required:
          - goal
        goal_default:
          resource: []
          target_device: ''
          mount_resource: []
          formulations: []
          assembly_data: []
          csv_export_dir: 'D:\2604Agentic_test'
          timeout_seconds: 86400
          assignee_user_ids: []
          A:
            default_collector_mass: null
            default_active_material: null
            default_capacity: null
            default_battery_system: null
          B:
            collector_mass: []
            active_material: []
            capacity: []
            battery_system: []
          C:
            param_csv_path: ''
        handles:
          input:
          - handler_key: formulations
            data_type: array
            label: 配方信息列表
            data_key: formulations
            data_source: handle
            io_type: source
          - handler_key: assembly_data
            data_type: array
            label: 扣电组装数据列表
            data_key: assembly_data
            data_source: handle
            io_type: source
          output:
          - handler_key: target_device
            data_type: device_id
            label: 目标设备
            data_key: target_device
            data_source: executor
          - handler_key: resource
            data_type: resource
            label: 待转移资源
            data_key: resource.@flatten
            data_source: executor
          - handler_key: mount_resource
            data_type: resource
            label: 目标孔位
            data_key: mount_resource.@flatten
            data_source: executor
          - handler_key: collector_mass
            data_type: collector_mass
            label: 极流体质量
            data_key: collector_mass
            data_source: executor
          - handler_key: active_material
            data_type: active_material
            label: 活性物质含量
            data_key: active_material
            data_source: executor
          - handler_key: capacity
            data_type: capacity
            label: 克容量
            data_key: capacity
            data_source: executor
          - handler_key: battery_system
            data_type: battery_system
            label: xml工步
            data_key: battery_system
            data_source: executor
          - handler_key: pole_weight
            data_type: array
            label: 极片质量
            data_key: pole_weight
            data_source: executor
          - handler_key: coin_cell_code
            data_type: array
            label: 电池条码列表
            data_key: coin_cell_code
            data_source: executor
          - handler_key: electrolyte_code
            data_type: array
            label: 电解液二维码列表
            data_key: electrolyte_code
            data_source: executor
        placeholder_keys:
          resource: unilabos_resources
          target_device: unilabos_devices
          mount_resource: unilabos_resources
          assignee_user_ids: unilabos_manual_confirm
        always_free: true
        feedback_interval: 300
        node_type: manual_confirm
      submit_auto_export_excel:
        type: UniLabJsonCommandAsync
        goal:
          resource: resource
          mount_resource: mount_resource
          collector_mass: collector_mass
          active_material: active_material
          capacity: capacity
          battery_system: battery_system
          pole_weight: pole_weight
          coin_cell_code: coin_cell_code
          electrolyte_code: electrolyte_code
          output_dir: output_dir
        feedback: {}
        result:
          return_info: return_info
          success: success
          submitted_count: submitted_count
          total_count: total_count
          results: results
        schema:
          title: submit_auto_export_excel参数
          description: submit_auto_export_excel的参数schema
          type: object
          properties:
            goal:
              type: object
              properties:
                unilabos_device_id:
                  type: string
                  default: ''
                  description: UniLabOS设备ID，用于指定执行动作的具体设备实例
