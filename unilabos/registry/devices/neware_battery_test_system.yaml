  config_info: []
  description: 新威电池测试系统驱动，提供720个通道的电池测试状态监控、物料管理和CSV批量提交功能。支持TCP通信实现远程控制，包含完整的物料管理系统（2盘电池状态映射），以及从CSV文件批量提交测试任务的能力。
  handles: []
  icon: ''
  init_param_schema:
    config:
      properties:
        datacore_config:
          description: 'DataCore 大装置数据接入配置（来自图 JSON），支持字段

            enabled / ingest_url / device_id / device_key / timeout /

            total_timeout / retry_interval；不配置则不推送'
          type: object
        devtype:
          description: 设备类型标识
          type: string
        ip:
          description: TCP服务器IP地址
          type: string
        machine_ids:
          default:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 86
          items:
            type: integer
          type: array
        oss_prefix:
          default: neware_backup
          description: OSS对象路径前缀，默认"neware_backup"
          type: string
        oss_upload_enabled:
          default: false
          description: 是否启用OSS上传功能，默认False
          type: boolean
        port:
          description: TCP端口
          type: integer
        size_x:
          default: 50
          type: number
        size_y:
          default: 50
          type: number
        size_z:
          default: 20
          type: number
        timeout:
          description: 通信超时时间（秒）
          type: integer
      required: []
      type: object
    data:
      properties:
        channel_status:
          additionalProperties:
            type: object
          type: object
        connection_info:
          additionalProperties:
            type: string
          type: object
        device_summary:
          type: string
        status:
          type: string
        total_channels:
          type: integer
      required:
      - channel_status
      - connection_info
      - device_summary
      - status
      - total_channels
      type: object
  version: 1.0.0
