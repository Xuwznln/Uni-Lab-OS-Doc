      auto-stack_inquiry_2to1:
        feedback: {}
        goal: {}
        goal_default:
          poll_interval: 5.0
          timeout: 3600
          type_keyword: 分液瓶板
          match_by_material_id: true
          target_wh_id: ''
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: 321 转运的【前置】门控：确认 1号2号交接堆栈(0016) 可以放新板。必须排在 transfer_3_to_2_to_1_auto 之前——321 会把新板放进 0016，而 0016 只有 1 个库位，所以放之前必须确认它是空的；放到 321 之后就退化成一句无用查询，不会报错，只是保护静默失效。判定分两条路：0016 本就空则立即放行（快速路径，不查 0017）；0016 有板则快照这些 materialId，等它们既离开 0016、又出现在 2号内部堆栈(0017)，确认板真的回流到位而不是刚离开还在途中。
          properties:
            feedback: {}
            goal:
              properties:
                poll_interval:
                  default: 5.0
                  description: 轮询间隔（秒），默认 5 秒
                  type: number
                timeout:
                  default: 3600
                  description: 最长等待秒数，默认 3600 秒（1 小时）；超时报错
                  type: integer
                type_keyword:
                  default: 分液瓶板
                  title: 板型关键字
                  description: 默认「分液瓶板」会同时匹配 5ml 与 20ml。扣电路应显式传「5ml分液瓶板」——否则 0016 里若停着一块 20ml 板（它走 3→2，不经 1→2 回 0017），「到位 0017」这个判据永远不成立，只能等到超时。
                  type: string
                match_by_material_id:
                  default: true
                  title: 按 materialId 追踪回流
                  description: 是否按 materialId 精确追踪板回流到 0017。置 false 则退化为只要 0016 腾空即放行（旧行为）。
                  type: boolean
                target_wh_id:
                  default: ''
                  title: 回流目标仓库 whId
                  description: 留空则用 2号手套箱内部堆栈(0017)。一般不需要填。
                  type: string
              required: []
              type: object
            result:
              properties:
                arrived_material_ids:
                  description: 已确认回流到 0017 的 materialId
                  items:
                    type: string
                  type: array
                elapsed_seconds:
                  type: number
                fast_path:
                  description: 是否走了快速路径（进入时 0016 本来就空）
                  type: boolean
                pending_material_ids:
                  description: 进入时 0016 上待回流的 materialId 快照
                  items:
                    type: string
                  type: array
                poll_count:
                  type: integer
                status:
                  type: string
              type: object
          required:
          - goal
          title: stack_inquiry_2to1参数
          type: object
        type: UniLabJsonCommand
      auto-stack_inquiry_window_5_free:
        feedback: {}
        goal: {}
        goal_default:
          required_slots: 4
          poll_interval: 5.0
          timeout: 36000
          type_keyword: ''
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: 建单【前置】门控：等 5号自动传递窗(0018) 的空闲库位数 ≥ required_slots。必须排在 create_orders 之前——配液流程结束时电导板已经直接堆在 0018 上，等「到位」没有意义；真正的瓶颈是 0018 只有 4 个库位，而一块板对应一个温度点。上一轮的板测完转去 0027、腾出空位后，下一轮才能建单。放到 create_orders 之后不会报错，只是保护静默失效（门控会打 warning 提示位置可疑）。
          properties:
            feedback: {}
            goal:
              properties:
                required_slots:
                  default: 4
                  title: 本轮需要的库位数
                  description: 等于本轮温度点数（1–4），应与传给 conductivity_test_inline 的 temperature_points 长度一致。默认 4 是最保守取值（等 0018 全空），按实际温度点数传可少等。超出 1–4 直接报错，因为传递窗物理上放不下。
                  maximum: 4
                  minimum: 1
                  type: integer
                poll_interval:
                  default: 5.0
                  description: 轮询间隔（秒），默认 5 秒
                  type: number
                timeout:
                  default: 36000
                  description: 最长等待秒数，默认 36000 秒（10 小时），匹配电导测试时长
                  type: integer
                type_keyword:
                  default: ''
                  title: 板型关键字
                  description: 只统计含该关键字的板占用；留空则任何物料都算占位（0018 是限量通道，默认按最保守口径算）。
                  type: string
              required: []
              type: object
            result:
              properties:
                elapsed_seconds:
                  type: number
                free_slots:
                  description: 放行时的空闲库位数
                  type: integer
                poll_count:
                  type: integer
                required_slots:
                  type: integer
                status:
                  type: string
