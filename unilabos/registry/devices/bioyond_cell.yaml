                    type: string
                  type: array
                bottle_type:
                  default: 配液小瓶
                  description: 配液瓶类型
                  type: string
                conductivity_bottle_count:
                  default: 0
                  description: 电导测试分液瓶数
                  type: integer
                conductivity_volume:
                  default: 0.0
                  description: 电导率测试分液体积
                  type: number
                formulation:
                  description: 配方列表，每个元素代表一个订单（一瓶）
                  items:
                    properties:
                      materials:
                        description: 物料列表
                        items:
                          properties:
                            mass:
                              description: 质量(g)
                              type: number
                            name:
                              description: 物料名称
                              type: string
                          required:
                          - name
                          - mass
                          type: object
                        type: array
                      order_name:
                        description: 配方名称（可选）
                        type: string
                    required:
                    - materials
                    type: object
                  type: array
                coin_cell_volume:
                  default: 0.0
                  description: 纽扣电池组装分液体积
                  type: number
                mix_time:
                  default: []
                  description: 混匀时间列表(秒)，与 formulation 一一对应
                  items:
                    type: integer
                  type: array
                pouch_cell_volume:
                  default: 0.0
                  description: 软包电池注液组装分液体积
                  type: number
                csv_export_path:
                  default: ''
                  description: CSV导出目录路径，为空则不导出
                  type: string
              required:
              - formulation
              type: object
            result: {}
          required:
          - goal
          title: create_orders_formulation参数
          type: object
        type: UniLabJsonCommand
      auto-conductivity_test_external:
        always_free: true
        feedback: {}
        goal: {}
        goal_default:
          xlsx_path: null
          validate_barcode: true
          start_scheduler: true
          wait_for_finish: true
          wait_timeout_seconds: 36000
          csv_export_path: ''
        handles:
          output:
          - data_key: total_entries
            data_source: executor
            data_type: integer
            handler_key: conductivity_total_entries
            label: 电导实验条目数
          - data_key: validated_barcodes
            data_source: executor
            data_type: array
            handler_key: conductivity_validated_barcodes
            label: 已校验通过的板条码列表
          - data_key: conductivity_results
            data_source: executor
            data_type: array
            handler_key: conductivity_results_output
            label: 电导结果列表
        placeholder_keys: {}
        result: {}
        schema:
          description: 5号电导工作站外部进样新建实验（手动填 Excel 模板批量提交）。Excel 列：算法批次ID/配方ID/创建日期/板BarCode/内部瓶位置X/内部瓶位置Y/温控点。提交前会按板条码批量校验物料系统是否已建对应分液板。默认 wait_for_finish=true：建单后阻塞等所有电导单完成，再按 orderId 调 conductivity-order-result 拉取电导率/温度，导出 External_conductivity_*.csv。
          properties:
            feedback: {}
            goal:
              properties:
                xlsx_path:
                  description: 电导实验模板 xlsx 路径
                  type: string
                validate_barcode:
                  default: true
                  description: 是否在提交前校验 plateBarCode 在物料系统中存在
                  type: boolean
                start_scheduler:
                  default: true
                  description: 提交订单前是否先启动调度（外部进样路径没有上游管调度，默认 true 确保订单进队列后立即消费）
                  type: boolean
                wait_for_finish:
                  default: true
                  description: 是否阻塞等所有电导单完成并拉取结果。true=节点运行到测试完成再导出 CSV；false=fire-and-forget，POST 完即返回。
                  type: boolean
                wait_timeout_seconds:
                  default: 36000
                  description: 单个电导单 wait 超时秒数，仅 wait_for_finish=true 时生效。默认 36000 秒（10 小时）。
                  type: integer
                csv_export_path:
                  default: ''
                  description: 电导结果 CSV 导出目录（External_conductivity_年月日时分秒.csv），为空则不导出。
                  type: string
              required:
              - xlsx_path
              type: object
            result: {}
          required:
          - goal
          title: conductivity_test_external参数
          type: object
        type: UniLabJsonCommand
      auto-conductivity_test_inline:
        always_free: true
        feedback: {}
        goal: {}
        goal_default:
          vial_plates: null
          temperature_points: null
          mass_ratios: null
          validate_barcode: true
          wait_for_finish: true
          wait_timeout_seconds: 36000
          csv_export_path: ''
        handles:
          input:
          - data_key: '@this@@@vial_plates'
            data_source: handle
            data_type: array
            handler_key: vial_plates_input
            label: 分液瓶板列表
          - data_key: '@this@@@mass_ratios'
            data_source: handle
            data_type: array
            handler_key: mass_ratios_input
            label: 配方信息列表
          output:
          - data_key: conductivity_results
            data_source: executor
            data_type: array
            handler_key: conductivity_results_output
            label: 电导结果列表
        placeholder_keys: {}
        result: {}
        schema:
          description: 5号电导工作站自动新建实验（配液站传过来）。直接接收上游配液 handle 输出的 vial_plates（含 batch_id/orderCode/barCode/materialId）与 mass_ratios（配方信息）。上游会把订单产出的全部20ml分液瓶板都传过来，本 action 提交前会查 warehouse-info(5号自动传递窗) 按 materialId 取交集，只对已转运到5号站的板建电导单（需在转运后调用）。通过 material-info 查每块板的真实瓶位 (X,Y)；多 order 共用同一物理板时按 bottle.associateId 反查归属 orderCode。同一块板上的所有分液瓶共享同一温度点。默认 wait_for_finish=true：节点会阻塞到所有 LIMS 新建电导单收到 /report/order_finish 推送（数小时级），完成后按 orderId 调 conductivity-order-result 拉取结果，并在同一目录导出两份 CSV：Inline_conductivity_*.csv（电导-only）与 Formulation_Conductivity_*.csv（按分液瓶二维码合并配方信息）。
          properties:
            feedback: {}
            goal:
              properties:
                vial_plates:
                  description: 分液瓶板列表（来自配液输出的 handle，每项需含 batch_id/materialId/barCode/orderCode）
                  items:
                    properties:
                      barCode:
                        type: string
                      batch_id:
                        type: string
                      materialId:
                        type: string
                      orderCode:
                        type: string
                    required:
                    - batch_id
                    - materialId
                    - barCode
                    - orderCode
                    type: object
                  type: array
                temperature_points:
                  description: 温度点列表（℃）。长度=1 时广播到所有分液板；长度=分液板数时按顺序一一对应；其他长度报错。业务规则：一块板共享一个温度，板上所有分液瓶都用该温度。
                  items:
                    type: number
                  type: array
                mass_ratios:
                  description: 配方信息列表（来自配液 mass_ratios 输出 handle）。用于测试完成后按"分液瓶二维码"合并出配液+电导报告；为空则只出电导报告。
                  items:
                    type: object
                  type: array
                validate_barcode:
                  default: true
                  description: 是否在提交前校验 plateBarCode 在物料系统中存在
                  type: boolean
                wait_for_finish:
                  default: true
                  description: 是否阻塞等所有 LIMS 新建电导单收到 /report/order_finish 推送。true=与配液一致，节点会一直运行到测试完成；false=fire-and-forget，POST 完即返回，剩下交给奔曜软件。
                  type: boolean
                wait_timeout_seconds:
                  default: 36000
                  description: 单个电导单 wait 超时秒数，仅 wait_for_finish=true 时生效。默认 36000 秒（10 小时），与配液一致。
                  type: integer
                csv_export_path:
                  default: ''
                  description: CSV 导出目录，为空则不导出。非空时在同一目录生成 Inline_conductivity_*.csv（电导-only）与 Formulation_Conductivity_*.csv（配液+电导）。
                  type: string
              required:
              - vial_plates
              - temperature_points
              type: object
            result: {}
          required:
          - goal
          title: conductivity_test_inline参数
          type: object
        type: UniLabJsonCommand
