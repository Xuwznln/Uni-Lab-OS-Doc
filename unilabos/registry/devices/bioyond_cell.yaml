          formulation: unilabos_formulation
        result: {}
        schema:
          description: 配方批量输入版本的创建实验——通过前端配方组件输入物料配比，替代Excel导入
          properties:
            feedback: {}
            goal:
              properties:
                batch_id:
                  default: ''
                  description: 批次ID，为空则自动生成时间戳
                  type: string
                order_names:
                  default: []
                  description: 配方ID/订单编号列表，与formulation一一对应，用于填写DoE撒点编号等自定义标识，便于后续追溯。未填则自动生成。
