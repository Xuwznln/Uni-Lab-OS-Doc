                  description: 进入时先查 scheduler-status。Init/Stop 与 ErrorPause/ErrorStop 直接阻断；Pause 若带建单失败标记也直接阻断（那是自动暂停的，等下去不会好），否则轮询等待。不检查的话调度没起来时建单会成功但没人消费，最后表现成「配液超时失败」，极难定位。
