          - data_key: mass_ratios
            data_source: executor
            data_type: array
            handler_key: mass_ratios_output
            label: 配方信息列表
          - data_key: vial_bottle_positions
            data_source: executor
            data_type: array
            handler_key: vial_bottle_positions_output
            label: 分液瓶孔位映射（板/XY/归属订单）
          - data_key: vial_321_source_pos
            data_source: executor
            data_type: object
            handler_key: vial_321_source_pos_output
            label: 5ml瓶板源坐标（321任务）
          - data_key: vial_32_source_pos
            data_source: executor
            data_type: object
            handler_key: vial_32_source_pos_output
            label: 20ml瓶板源坐标（32任务）
        placeholder_keys: {}
        result: {}
        schema:
          description: ''
          properties:
            feedback: {}
            goal:
              properties:
                xlsx_path:
                  title: 新建实验文件路径
                  type: string
                csv_export_path:
                  default: ''
                  title: "配液实验报告文件路径\n（需要主控电脑的路径）"
                  description: CSV导出目录路径，为空则不导出
                  type: string
              required:
              - xlsx_path
              type: object
            result: {}
          required:
          - goal
          title: create_orders参数
          type: object
        type: UniLabJsonCommand
      auto-create_orders_formulation:
        always_free: true
        feedback: {}
        goal: {}
        goal_default:
          batch_id: ''
          order_names: []
          bottle_type: 配液小瓶
          conductivity_bottle_count: 0
          conductivity_volume: 0.0
          formulation: null
          coin_cell_volume: 0.0
          mix_time: []
          pouch_cell_volume: 0.0
          csv_export_path: ''
        handles:
          output:
          - data_key: total_orders
            data_source: executor
            data_type: integer
            handler_key: bottle_count
            label: 配液瓶数
          - data_key: vial_plates
            data_source: executor
            data_type: array
            handler_key: vial_plates_output
            label: 分液瓶板列表
          - data_key: mass_ratios
            data_source: executor
            data_type: array
            handler_key: mass_ratios_output
            label: 配方信息列表
          - data_key: vial_bottle_positions
            data_source: executor
            data_type: array
            handler_key: vial_bottle_positions_output
            label: 分液瓶孔位映射（板/XY/归属订单）
          - data_key: vial_321_source_pos
            data_source: executor
            data_type: object
            handler_key: vial_321_source_pos_output
            label: 5ml瓶板源坐标（321任务）
          - data_key: vial_32_source_pos
            data_source: executor
            data_type: object
            handler_key: vial_32_source_pos_output
            label: 20ml瓶板源坐标（32任务）
        placeholder_keys:
          formulation: unilabos_formulation
        result: {}
        schema:
          description: 配方批量输入版本的创建实验——通过前端配方组件输入物料配比，替代Excel导入
          properties:
            feedback: {}
            goal:
              properties:
                batch_id:
                  default: ''
                  title: 批次
                  description: 批次ID，为空则自动生成时间戳，每一个批次需要修改
                  type: string
                order_names:
                  default: []
                  title: 订单名称
                  description: 配方ID/订单编号列表，与formulation一一对应，用于填写DoE撒点编号等自定义标识，便于后续追溯。未填则自动生成。
                  items:
                    type: string
                  type: array
                bottle_type:
                  default: 配液小瓶
                  title: 配液瓶类型
                  description: 填写配液小瓶/配液大瓶
                  type: string
                conductivity_bottle_count:
                  default: 0
                  title: 电导测试分液瓶数
                  description: 电导测试可选择1-4瓶
                  type: integer
                conductivity_volume:
                  default: 0.0
                  title: 电导测试分液体积（mL)
                  description: 建议分8ml，匹配电导站电极插入深度
                  type: number
                formulation:
                  description: 配方列表，每个元素代表一个订单（一瓶）
                  items:
                    properties:
                      materials:
                        description: 物料列表
                        items:
                          properties:
                            mass:
                              description: 质量(g)
                              type: number
                            name:
                              description: 物料名称
                              type: string
                          required:
                          - name
                          - mass
                          type: object
                        type: array
                      order_name:
                        description: 配方名称（可选）
                        type: string
                    required:
                    - materials
                    type: object
                  type: array
                coin_cell_volume:
                  default: 0.0
                  title: 扣电组装分液体积（mL)
                  description: 扣电组装选择5mL分液瓶进行分液
                  type: number
                mix_time:
                  default: []
                  title: 混合时间（s）
                  description: 混匀时间列表(秒)，与formulation一一对应
                  items:
                    type: integer
                  type: array
                pouch_cell_volume:
                  default: 0.0
                  title: 软包组装分液体积（mL)
                  description: 软包电池注液组装分液体积
                  type: number
                csv_export_path:
                  default: ''
                  title: "配液实验报告文件路径\n（需要主控电脑的路径）"
                  description: CSV导出目录路径，为空则不导出
                  type: string
              required:
              - formulation
              type: object
            result: {}
          required:
          - goal
          title: create_orders_formulation参数
          type: object
        type: UniLabJsonCommand
      auto-export_order_report:
        always_free: true
        feedback: {}
        goal: {}
        goal_default:
          order_codes: ''
          csv_export_path: ''
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: 按 BSO 订单号现查 LIMS 导出配液实验报告 CSV，不依赖 order_finish 推送，可补历史批次
          properties:
            feedback: {}
            goal:
              properties:
                order_codes:
                  title: BSO订单号
                  description: "支持单个 BSO2026072800006；区间 BSO2026072800006-BSO2026072800029\
                    \ 或尾号简写 BSO2026072800006-29；逗号跳选 BSO2026072800006,BSO2026072800012-15；跨批次请用逗号分开写"
                  type: string
                csv_export_path:
                  title: "实验报告导出目录\n（需要主控电脑的路径）"
                  description: CSV 导出目录，报告 Excel 存到其下 reports/ 子目录
                  type: string
              required:
              - order_codes
              - csv_export_path
              type: object
            result: {}
          required:
          - goal
          title: export_order_report参数
          type: object
        type: UniLabJsonCommand
      auto-conductivity_test_external:
        always_free: true
        feedback: {}
        goal: {}
        goal_default:
          xlsx_path: null
          validate_barcode: true
          start_scheduler: true
          wait_for_finish: true
          wait_timeout_seconds: 36000
          csv_export_path: ''
        handles:
          output:
          - data_key: total_entries
            data_source: executor
            data_type: integer
            handler_key: conductivity_total_entries
            label: 电导实验条目数
          - data_key: validated_barcodes
            data_source: executor
            data_type: array
            handler_key: conductivity_validated_barcodes
            label: 已校验通过的板条码列表
          - data_key: conductivity_results
            data_source: executor
            data_type: array
            handler_key: conductivity_results_output
            label: 电导结果列表
        placeholder_keys: {}
        result: {}
        schema:
          description: 5号电导工作站外部进样新建实验（手动填 Excel 模板批量提交）。Excel 列：算法批次ID/配方ID/创建日期/板BarCode/内部瓶位置X/内部瓶位置Y/温控点。提交前会按板条码批量校验物料系统是否已建对应分液板。默认 wait_for_finish=true：建单后阻塞等所有电导单完成，再按 orderId 调 conductivity-order-result 拉取电导率/温度，导出 External_conductivity_*.csv。
          properties:
            feedback: {}
            goal:
              properties:
                xlsx_path:
                  title: 电导实验模板路径
                  description: 电导实验模板 xlsx 路径
                  type: string
                validate_barcode:
                  default: true
                  title: 条码验证
                  description: 是否在提交前校验 plateBarCode 在物料系统中存在
                  type: boolean
                start_scheduler:
                  default: true
                  title: 启动调度
                  description: 提交订单前是否先启动调度（外部进样路径没有上游管调度，默认 true 确保订单进队列后立即消费）
                  type: boolean
                wait_for_finish:
                  default: true
                  title: 等待完成
                  description: 是否阻塞等所有电导单完成并拉取结果。true=节点运行到测试完成再导出 CSV；false=fire-and-forget，POST 完即返回。
                  type: boolean
                wait_timeout_seconds:
                  default: 36000
                  title: 等待超时时间（秒）
                  description: 单个电导单 wait 超时秒数，仅 wait_for_finish=true 时生效。默认 36000 秒（10 小时）。
                  type: integer
                csv_export_path:
                  default: ''
                  title: 电导结果CSV导出路径
                  description: 电导结果 CSV 导出目录（External_conductivity_年月日时分秒.csv），为空则不导出。
                  type: string
              required:
              - xlsx_path
              type: object
            result: {}
          required:
          - goal
          title: conductivity_test_external参数
          type: object
        type: UniLabJsonCommand
      auto-conductivity_test_inline:
        always_free: true
        feedback: {}
        goal: {}
        goal_default:
          vial_plates: null
          temperature_points: null
          vial_bottle_positions: null
          mass_ratios: null
          validate_barcode: true
          wait_for_finish: true
          wait_timeout_seconds: 36000
          csv_export_path: ''
        handles:
          input:
          - data_key: '@this@@@vial_plates'
            data_source: handle
            data_type: array
            handler_key: vial_plates_input
            label: 分液瓶板列表
          - data_key: '@this@@@vial_bottle_positions'
            data_source: handle
            data_type: array
            handler_key: vial_bottle_positions_input
            label: 分液瓶孔位映射（板/XY/归属订单）
          - data_key: '@this@@@mass_ratios'
            data_source: handle
            data_type: array
            handler_key: mass_ratios_input
            label: 配方信息列表
          output:
          - data_key: conductivity_results
            data_source: executor
            data_type: array
            handler_key: conductivity_results_output
            label: 电导结果列表
        placeholder_keys: {}
        result: {}
        schema:
          description: 5号电导工作站自动新建实验（配液站传过来）。直接接收上游配液 handle 输出的 vial_plates（含 batch_id/orderCode/barCode/materialId）、vial_bottle_positions（分液瓶孔位映射，板/XY/归属订单）与 mass_ratios（配方信息）。上游会把订单产出的全部20ml分液瓶板都传过来，本 action 提交前会查 warehouse-info(5号自动传递窗) 按 materialId 取交集，只对已转运到5号站的板建电导单（需在转运后调用）。每瓶的归属订单与瓶位(X,Y)直接取自 vial_bottle_positions（按 detailMaterialId→orderCode 权威映射，已过滤空占位孔），不再现场按 associateId 反查。同一块板上的所有分液瓶共享同一温度点。默认 wait_for_finish=true：节点会阻塞到所有 LIMS 新建电导单收到 /report/order_finish 推送（数小时级），完成后按 orderId 调 conductivity-order-result 拉取结果，并在同一目录导出两份 CSV：Inline_conductivity_*.csv（电导-only）与 Formulation_Conductivity_*.csv（按分液瓶二维码合并配方信息）。
          properties:
            feedback: {}
            goal:
              properties:
                vial_plates:
                  title: 分液瓶板
                  description: 无需填写
                  items:
                    properties:
                      barCode:
                        type: string
                      batch_id:
                        type: string
                      materialId:
                        type: string
                      orderCode:
                        type: string
                    required:
                    - batch_id
                    - materialId
                    - barCode
                    - orderCode
                    type: object
                  type: array
                temperature_points:
                  title: 温度点
                  description: "温度点列表（℃）。\n需打开温控模块提前预热。\n业务规则：一块板共享一个温度，板上所有分液瓶都用该温度。最高设置4个温度点：温控模块ABC只能做5℃以上温控，-10℃至5℃需要用温控模块D"
                  items:
                    type: number
                  type: array
                vial_bottle_positions:
                  title: 分液瓶位置
                  description: 无需填写
                  items:
                    type: object
                  type: array
                mass_ratios:
                  title: 质量比
                  description: 无需填写
                  items:
                    type: object
                  type: array
                validate_barcode:
                  default: true
                  title: 条码验证
                  description: 无需填写
                  type: boolean
                wait_for_finish:
                  default: true
                  title: 等待完成
                  description: 是否阻塞等所有LIMS新建电导单收到/report/order_finish 推送。true=与配液一致，节点会一直运行到测试完成；false=fire-and-forget，POST完即返回，剩下交给奔曜软件
                  type: boolean
                wait_timeout_seconds:
                  default: 36000
                  title: 等待超时时间（秒）
                  description: 单个电导wait超时秒数，仅 wait_for_finish=true时生效。默认36000秒（10小时），与配液一致
                  type: integer
                csv_export_path:
                  default: ''
                  title: 电导结果CSV导出路径
                  description: 电导结果CSV导出目录
                  type: string
              required:
              - vial_plates
              - temperature_points
              - vial_bottle_positions
              type: object
            result: {}
          required:
          - goal
          title: conductivity_test_inline参数
          type: object
        type: UniLabJsonCommand
      auto-create_sample:
        feedback: {}
        goal: {}
        goal_default:
          board_type: null
          bottle_type: null
          location_code: null
          name: null
          warehouse_name: 手动传递窗右
          barcode: ''
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: ''
          properties:
            feedback: {}
            goal:
              properties:
                board_type:
                  description: 板类型，如 "5ml分液瓶板"、"配液瓶(小)板"
                  type: string
                bottle_type:
                  description: 瓶类型，如 "5ml分液瓶"、"配液瓶(小)"
                  type: string
                location_code:
                  description: 库位编号，例如 "A01"
                  type: string
                name:
                  description: 物料名称
                  type: string
                warehouse_name:
                  default: 手动传递窗右
                  description: 仓库名称，默认为 "手动传递窗右"，支持 "自动堆栈-左"、"自动堆栈-右" 等
                  type: string
                barcode:
                  default: ''
                  description: 物料条码（可选），填写后发给奔曜；不填则为空字符串
                  type: string
              required:
              - name
              - board_type
              - bottle_type
              - location_code
              type: object
            result: {}
          required:
          - goal
          title: create_sample参数
          type: object
        type: UniLabJsonCommand
      auto-wait_orderlist_idle:
        feedback: {}
        goal: {}
        goal_default:
          lookback_minutes: 3600
          poll_interval: 10.0
          timeout: 86400
          scenario: all
          workflow_name_keyword: ''
          page_size: 50
          max_pages: 40
          check_scheduler: true
          claim_timeout: 7200.0
          xlsx_path: ''
          task_hint: ''
        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: 多任务互锁门控：阻塞到「本工站可以安全发起下一批配液」为止。放在 create_orders 之前，整条链路只调一次（建单后的完成等待由 create_orders 内部负责）。放行需同时满足：调度处于 Running；窗口内无失败(90)配液单；窗口内无执行中(60)配液单；上一批缓存为空或已全部到 80/100；能占据放行凭证（上一个放行者已完成建单交接）。凭证填的是门控返回到 LIMS 把订单登记成 60 之间的空窗，没有它两批会同时建单击穿 0016(1位)/0018(4位) 容量。
          properties:
            feedback: {}
            goal:
              properties:
                lookback_minutes:
                  default: 3600
                  title: 回溯窗口（分钟）
                  description: 默认 3600（60 小时），覆盖多批 1–8 瓶的长周期与隔夜任务。现场遇到旧失败单锁站时可临时调小跨过去——没有失败确认机制，一次失败会锁到该单滑出窗口为止，门控 blocked 时会打印具体滑出钟点。
                  type: integer
                poll_interval:
                  default: 10.0
                  description: 未空闲时的轮询间隔（秒）
                  type: number
                timeout:
                  default: 86400
                  description: 整次门控最长等待（秒），默认 86400（24 小时）
                  type: integer
                scenario:
                  default: all
                  title: 场景键
                  description: "可选 all/coin/pouch/cond。⚠️ 当前只影响过滤范围与分场景统计，不收窄阻断作用域——配液共用同一台奔曜分液硬件，两批物理上不可能并行，收窄会把第二批放进去。命名陷阱：配液分液(小瓶)(电导) 其实是扣电路，名字里的「电导」是 LIMS 历史遗留。"
