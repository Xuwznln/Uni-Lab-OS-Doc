        handles: {}
        placeholder_keys: {}
        result: {}
        schema:
          description: 组合函数:设备初始化 + 物料搜寻确认 + 切换自动模式 + 启动。初始化过程中会自动检测物料搜寻确认弹窗，并根据参数自动点击"是"或"否"按钮
          properties:
            feedback: {}
            goal:
              properties:
                material_search_enable:
                  default: false
                  title: 使用物料检索
                  description: "是否启用物料搜寻功能。设备初始化后会弹出物料搜寻确认弹窗，此参数控制自动点击‘是'（启用）或‘否'（不启用）。默认为False（不启用物料搜寻）。"
