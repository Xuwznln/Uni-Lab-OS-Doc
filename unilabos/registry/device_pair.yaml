pairs:
  - real: incubator.liconic_stx110
    virtual: virtual_liconic_stx110
    engine: rviz
    twin_capability:
      enabled: true
      observed: [carousel_angle, temperature, status]
      throttle_hz: 5
  # RMF AGV 专用配对（#17 §8.6 / #18 §6.2-(6)）：仅 fleet 移动机器人 + 被 rmf_coordinator
  # 管理者生效，不影响机械臂/泵/阀。engine/applies_to 为前向过滤字段（PairRegistry 补齐
  # 该过滤前，sim 模式下 agv.SEER→agv.RMFSim 只命中 SEER AGV，本身即安全；如需更严格的
  # managed_by 过滤，请在 graph 直接写 agv.RMFSim 规避（#17 §8.2）。
  - real: agv.SEER
    virtual: agv.RMFSim
    engine: rmf
    twin_observed: [pose, status, battery]
    twin_throttle_hz: 10
    applies_to:
      category: fleet_mobile_robot
      managed_by: rmf_coordinator

  - real: heaterstirrer.dalong
    virtual: virtual_heatchill
    twin_observed: [temperature, rpm, status]
    twin_throttle_hz: 2

  - real: syringe_pump_with_valve.runze.SY03B-T06
    virtual: virtual_transfer_pump
    twin_observed: [status, volume, valve_position]
    twin_throttle_hz: 5

  - real: syringe_pump_with_valve.runze.SY03B-T08
    virtual: virtual_transfer_pump
    twin_observed: [status, volume, valve_position]
    twin_throttle_hz: 5

  - real: vacuum_pump.mock
    virtual: virtual_vacuum_pump
    twin_observed: [status]
    twin_throttle_hz: 2

  - real: gas_source.mock
    virtual: virtual_gas_source
    twin_observed: [status]
    twin_throttle_hz: 2

  - real: solenoid_valve
    virtual: virtual_solenoid_valve
    twin_observed: [valve_position, status]
    twin_throttle_hz: 10

  - real: solenoid_valve.mock
    virtual: virtual_solenoid_valve
    twin_observed: [valve_position, status]
    twin_throttle_hz: 10

  - real: virtual_multiway_valve
    virtual: virtual_multiway_valve
    twin_observed: [current_position, valve_state, status]
    twin_throttle_hz: 10

  - real: robotic_arm.elite
    virtual: robotic_arm.SCARA_with_slider.moveit.virtual
    twin_observed: [joint_states, tcp_pose]
    twin_throttle_hz: 50

  - real: Qone_nmr
    virtual: null
    missing_sim_policy: fail

  - real: cameracontroller_device
    virtual: null
    missing_sim_policy: skip

  - real: virtual_centrifuge
    virtual: virtual_centrifuge
  - real: virtual_column
    virtual: virtual_column
  - real: virtual_filter
    virtual: virtual_filter
  - real: virtual_gas_source
    virtual: virtual_gas_source
  - real: virtual_heatchill
    virtual: virtual_heatchill
  - real: virtual_rotavap
    virtual: virtual_rotavap
  - real: virtual_separator
    virtual: virtual_separator
  - real: virtual_solenoid_valve
    virtual: virtual_solenoid_valve
  - real: virtual_solid_dispenser
    virtual: virtual_solid_dispenser
  - real: virtual_stirrer
    virtual: virtual_stirrer
  - real: virtual_transfer_pump
    virtual: virtual_transfer_pump
  - real: virtual_vacuum_pump
    virtual: virtual_vacuum_pump
