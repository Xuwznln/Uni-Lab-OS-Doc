# canonical filename `unilab_simulation_pairs.yaml`.
pairs:
  - real: dalong_heaterstirrer
    real_template_uuid: "11111111-1111-1111-1111-111111111111"
    engine: gazebo
    virtual: gazebo_dalong_heaterstirrer
    virtual_template_uuid: "22222222-2222-2222-2222-222222222222"
    missing_sim_policy: fail
    is_default: true
    priority: 100
    twin_capability:
      enabled: true
      observed: [temperature, rpm]
      throttle_hz: 20
